appId: com.shohankhan.dentivapro
productName: Dentiva Pro
copyright: Copyright © 2026 Shohan Khan. All rights reserved.

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# Fonts must live outside the asar so the print pipeline's file:// HTML can
# load them via pathToFileURL (Bengali shaping depends on these woff2 files).
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - "**/*"

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Dentiva-Pro-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dentiva Pro
  uninstallDisplayName: Dentiva Pro
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: Dentiva-Pro-Setup-${version}.${ext}

publish: null
