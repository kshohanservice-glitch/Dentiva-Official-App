name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit · Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build renderer (Vite)
        run: npm run build:renderer
      - name: Build main + preload
        run: npm run build:main && npm run build:preload

  e2e-windows:
    name: E2E (Windows · Electron)
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies (with native bindings)
        run: npm ci
      - name: Build full app
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E (47 mandatory flows)
        env:
          # Injected from repository secret — never committed. The production
          # activation code is derived to SHIPPED_VERIFIER at build time; the
          # plaintext is only available to the CI runner via this secret.
          DENTIVA_E2E_ACTIVATION_CODE: ${{ secrets.DENTIVA_E2E_ACTIVATION_CODE }}
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
